name: SOXL Sniper Bot

on:
  schedule:
    # ⏰ 매일 한국 시간 오후 4시(UTC 오전 7시)에 정기 실행
    - cron: '0 7 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4  # 👈 v3에서 v4로 업그레이드 (Node.js 20 경고 해결)

    - name: Set up Python
      uses: actions/setup-python@v5  # 👈 v4에서 v5로 업그레이드 (구동 환경 최적화)
      with:
          python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Trading Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python soxl_swing_bot.py

    - name: Commit & Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5  # 👈 v4에서 v5로 업그레이드 (쓰기 권한 에러 방지)
      with:
        commit_message: "System: Update SOXL trading position state"
